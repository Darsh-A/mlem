[package]
name = "mlem"
version = "0.1.0"
description = "A desktop cat pet that lives on your screen"
edition = "2021"

[lib]
name = "mlem_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
